<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seedess p2p all-videos example</title>
    <style>
      body { margin: 0; background: #070b14; color: #eef4ff; font: 15px/1.6 -apple-system, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
      video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
      code { color: #57d7ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Seedess p2p all-videos example</h1>
      <p>
        <code>auto()</code> patches hls.js once. Every player created afterwards joins the
        mesh. Replace <code>STREAM</code> and <code>TOKEN</code>.
      </p>
      <video id="video" controls playsinline></video>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script type="module">
      import { auto } from 'https://seedess.com/p2p.js';

      const STREAM = 'demo';
      const TOKEN = 'pk_…';
      const MASTER = `https://seedess.com/play/${STREAM}/master.m3u8?token=${TOKEN}`;

      // Call auto() before creating any player.
      auto({ stream: STREAM, token: TOKEN });

      // Existing player code is unchanged.
      const hls = new Hls();
      hls.loadSource(MASTER);
      hls.attachMedia(document.getElementById('video'));
    </script>
  </body>
</html>
